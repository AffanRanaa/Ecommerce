{% extends 'Base.html' %}
{% load static %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div
    id="add-product-page"
    data-product-list-url="{% url 'product-list' %}"
    data-product-detail-url="{% url 'product-detail-page' 0 %}"
>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Add Product</h4>
                </div>

                <div class="card-body">
                    <form id="product-form">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="title" class="form-label">Product Title</label>
                            <input
                                type="text"
                                id="title"
                                name="title"
                                class="form-control"
                                placeholder="Enter product title"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Enter product description"
                                required
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input
                                type="number"
                                id="price"
                                name="price"
                                class="form-control"
                                step="0.01"
                                min="0"
                                placeholder="Enter price"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="stock_quantity" class="form-label">Stock Quantity</label>
                            <input
                                type="number"
                                id="stock_quantity"
                                name="stock_quantity"
                                class="form-control"
                                min="0"
                                value="0"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="images" class="form-label">Product Images</label>
                            <input
                                type="file"
                                id="images"
                                name="images"
                                class="form-control"
                                accept="image/*"
                                multiple
                            >
                            <div class="form-text">
                                You can select images across multiple clicks — each new selection adds to the list below, it won't replace it.
                            </div>
                        </div>

                        <div id="image-preview" class="row g-2 mb-3"></div>

                        <div id="form-error" class="alert alert-danger d-none"></div>
                        <div id="form-success" class="alert alert-success d-none"></div>

                        <button
                            type="submit"
                            id="submit-btn"
                            class="btn btn-success w-100"
                        >
                            Add Product
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/add_product.js' %}"></script>
{% endblock %}
