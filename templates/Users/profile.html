{% extends 'Base.html' %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    My Profile
                </h3>

                <div
                    id="profile-error"
                    class="alert alert-danger d-none"
                ></div>

                <div
                    id="profile-success"
                    class="alert alert-success d-none"
                ></div>

                <form id="profile-form">

                    <div class="text-center mb-4">
                        <div id="current-picture"></div>
                    </div>

                    <div class="mb-3">
                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            readonly
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="phone_number"
                            class="form-label"
                        >
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="phone_number"
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="address"
                            class="form-label"
                        >
                            Address
                        </label>

                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label
                            for="display_picture"
                            class="form-label"
                        >
                            Display Picture
                        </label>

                        <input
                            type="file"
                            id="display_picture"
                            class="form-control"
                            accept="image/*"
                        >
                    </div>

                    <button
                        type="submit"
                        id="update-profile-btn"
                        class="btn btn-primary w-100"
                    >
                        Update Profile
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}


{% block extra_js %}
<script src="{% static 'js/profile.js' %}"></script>
{% endblock %}
